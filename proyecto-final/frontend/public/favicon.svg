<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="accretionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0ca3" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#7209b7" stop-opacity="1"/>
      <stop offset="55%" stop-color="#f72585" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="90%" stop-color="#b5179e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#240046" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="cosmicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(300, 300) rotate(-15)">
    
    
    <path d="M -180,0 C -170,-70 170,-70 180,0 C 120,-15 -120,-15 -180,0 Z" 
          fill="url(#accretionGrad)" 
          filter="url(#cosmicGlow)" 
          opacity="0.6"/>


    <ellipse cx="0" cy="0" rx="180" ry="65" fill="none" stroke="url(#accretionGrad)" stroke-width="12" filter="url(#cosmicGlow)"/>

    
    <circle cx="0" cy="0" r="72" fill="#000000" />
    
    
    <circle cx="0" cy="0" r="73" fill="none" stroke="#f72585" stroke-width="1.5" opacity="0.8" filter="url(#cosmicGlow)"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.9"/>

    
    <g filter="url(#cosmicGlow)">
      
      <path d="M -175,10 C -90,45 90,45 175,10 C 100,28 -100,28 -175,10 Z" 
            fill="url(#accretionGrad)" />
      
      <path d="M -120,18 C -60,32 60,32 120,18 C 50,23 -50,23 -120,18 Z" 
            fill="#ffffff" 
            opacity="0.95"/>
    </g>

    
    <path d="M -150,25 C -80,85 80,85 150,25 C 90,55 -90,55 -150,25 Z" 
          fill="url(#accretionGrad)" 
          opacity="0.4"
          filter="url(#cosmicGlow)"/>

  </g>
</svg>

